version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Major upgrades of the toolchain are planned work: TypeScript 7 (the
      # native compiler) and ESLint 10 need config and code changes, and
      # @types/node must track the Node major the service runs on (22).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
