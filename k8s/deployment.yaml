apiVersion: apps/v1
kind: Deployment
metadata:
  name: myqrlwallet-backend
  namespace: myqrlwallet
  labels:
    app: myqrlwallet-backend
    app.kubernetes.io/name: myqrlwallet-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: myqrlwallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myqrlwallet-backend
  template:
    metadata:
      labels:
        app: myqrlwallet-backend
    spec:
      containers:
        - name: backend
          # Image tag is updated by CI/CD pipeline via kustomize
          image: ghcr.io/myqrlwallet/backend:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: myqrlwallet-backend-config
            - secretRef:
                name: myqrlwallet-backend-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp-data
              mountPath: /tmp
      volumes:
        - name: tmp-data
          emptyDir: {}
      # Spread pods across nodes for high availability
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: myqrlwallet-backend
