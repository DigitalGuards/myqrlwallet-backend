# Secret template for sensitive configuration
# DO NOT commit actual secrets to version control!
#
# To create this secret in the cluster:
# 1. Copy this file and fill in base64-encoded values
# 2. Apply with: kubectl apply -f secret.yaml
#
# Or create directly with kubectl:
# kubectl create secret generic myqrlwallet-backend-secrets \
#   --namespace=myqrlwallet \
#   --from-literal=SMTP_HOST=smtp.example.com \
#   --from-literal=SMTP_PORT=587 \
#   --from-literal=SMTP_USER=your-smtp-user \
#   --from-literal=SMTP_PASS=your-smtp-password \
#   --from-literal=SMTP_FROM=noreply@qrlwallet.com \
#   --from-literal=SUPPORT_EMAIL=support@qrlwallet.com
#
apiVersion: v1
kind: Secret
metadata:
  name: myqrlwallet-backend-secrets
  namespace: myqrlwallet
  labels:
    app: myqrlwallet-backend
    app.kubernetes.io/name: myqrlwallet-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: myqrlwallet
type: Opaque
stringData:
  # SMTP Configuration for support emails
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE_WITH_ACTUAL_VALUE"
  SMTP_PASS: "REPLACE_WITH_ACTUAL_VALUE"
  SMTP_FROM: "noreply@qrlwallet.com"
  SUPPORT_EMAIL: "support@qrlwallet.com"
